name: Deploy
 
on:
  push:
    branches: ["devin/1774026028-initial-codebase"]
  pull_request:
    branches: ["devin/1774026028-initial-codebase"]
 
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
 
jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: []
    defaults:
      run:
        working-directory: healthcare-vetting-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: healthcare-vetting-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
 
      # Production deploy (push to default branch)
      - name: Deploy frontend to Cloudflare Pages (production)
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=viperai-app --branch=main --commit-dirty=true
 
      # Preview deploy (pull requests)
      - name: Deploy frontend to Cloudflare Pages (preview)
        if: github.event_name == 'pull_request'
        id: preview-frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=viperai-app --branch=pr-${{ github.event.pull_request.number }} --commit-dirty=true
 
      - name: Comment frontend preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `🔗 **Frontend preview:** https://pr-${{ github.event.pull_request.number }}.viperai-app.pages.dev`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Frontend preview:'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
 
  deploy-marketing:
    runs-on: ubuntu-latest
    needs: []
    defaults:
      run:
        working-directory: healthcare-vetting-marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: healthcare-vetting-marketing/package-lock.json
      - run: npm ci
      - run: npm run build
 
      # Production deploy (push to default branch)
      - name: Deploy marketing to Cloudflare Pages (production)
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=viperai-marketing --branch=main --commit-dirty=true
 
      # Preview deploy (pull requests)
      - name: Deploy marketing to Cloudflare Pages (preview)
        if: github.event_name == 'pull_request'
        id: preview-marketing
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=viperai-marketing --branch=pr-${{ github.event.pull_request.number }} --commit-dirty=true
 
      - name: Comment marketing preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `🔗 **Marketing preview:** https://pr-${{ github.event.pull_request.number }}.viperai-marketing.pages.dev`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Marketing preview:'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
