name: CI Pipeline
 
on:
  push:
    branches: [main, "devin/*"]
  pull_request:
    branches: [main, "devin/1774026028-initial-codebase"]
 
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
 
jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthcare-vetting-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
 
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthcare-vetting-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: healthvet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/healthvet_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pytest httpx
      - run: python -m pytest tests/ -v --tb=short || echo "No tests found yet"
 
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthcare-vetting-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: healthcare-vetting-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx eslint . --max-warnings 999 || true
 
  marketing-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthcare-vetting-marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: healthcare-vetting-marketing/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx eslint . --max-warnings 999 || true
