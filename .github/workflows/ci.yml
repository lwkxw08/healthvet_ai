name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ── Stage 1: Lint & Format Check ──────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: healthcare-vetting-backend
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit
          pip install -r requirements.txt

      - name: Run ruff lint
        working-directory: healthcare-vetting-backend
        run: ruff check app/ --output-format=github

      - name: Run ruff format check
        working-directory: healthcare-vetting-backend
        run: ruff format --check app/

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: healthcare-vetting-frontend
        run: npm ci

      - name: Run ESLint
        working-directory: healthcare-vetting-frontend
        run: npx eslint src/ --max-warnings=0 || true

  # ── Stage 2: Type Check ───────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: healthcare-vetting-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-requests

      - name: Run mypy
        working-directory: healthcare-vetting-backend
        run: mypy app/ --ignore-missing-imports --no-strict-optional || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: healthcare-vetting-frontend
        run: npm ci

      - name: Run TypeScript check
        working-directory: healthcare-vetting-frontend
        run: npx tsc --noEmit || true

  # ── Stage 3: Unit & Integration Tests ─────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: healthcare-vetting-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        working-directory: healthcare-vetting-backend
        run: python -m pytest tests/ -v --tb=short || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: healthcare-vetting-frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: healthcare-vetting-frontend
        run: npx vitest run || true

  # ── Stage 4: Build ────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: healthcare-vetting-frontend
        run: npm ci

      - name: Build frontend
        working-directory: healthcare-vetting-frontend
        run: npm run build

      - name: Build Docker image
        working-directory: healthcare-vetting-backend
        run: |
          docker build -t healthvet-backend:ci-${{ github.sha }} .

  # ── Stage 5: Security Scan ────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit (Python security linter)
        working-directory: healthcare-vetting-backend
        run: bandit -r app/ -ll --format json -o bandit-report.json || true

      - name: Run pip-audit
        working-directory: healthcare-vetting-backend
        run: pip-audit -r requirements.txt || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: healthcare-vetting-frontend
        run: npm ci

      - name: Run npm audit
        working-directory: healthcare-vetting-frontend
        run: npm audit --audit-level=high || true

      - name: Check for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
